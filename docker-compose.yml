services:
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: smart-delivery-api
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3600}
      PREDICTION_MODE: ${PREDICTION_MODE:-demo}
      MODEL_PATH: ${MODEL_PATH:-}
    volumes:
      - ./apps/backend/ml/artifacts:/app/ml/artifacts:ro
    ports:
      - "${API_PORT:-8600}:8600"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8600/api/health', timeout=3)"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8600}
        NEXT_PUBLIC_PREDICTION_MODE: ${NEXT_PUBLIC_PREDICTION_MODE:-api}
        NEXT_PUBLIC_MAP_STYLE_LIGHT_URL: ${NEXT_PUBLIC_MAP_STYLE_LIGHT_URL:-}
        NEXT_PUBLIC_MAP_STYLE_DARK_URL: ${NEXT_PUBLIC_MAP_STYLE_DARK_URL:-}
        NEXT_PUBLIC_GEOCODING_URL: ${NEXT_PUBLIC_GEOCODING_URL:-}
        NEXT_PUBLIC_ROUTING_URL: ${NEXT_PUBLIC_ROUTING_URL:-}
    container_name: smart-delivery-web
    environment:
      PORT: 3600
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8600}
    ports:
      - "${WEB_PORT:-3600}:3600"
    depends_on:
      api:
        condition: service_healthy

