name: smart-food-delivery
services:
  api:
    image: smart-food-delivery-api:${RELEASE_SHA:?}
    build:
      context: ${SOURCE_DIR:?}/apps/backend
    environment:
      PREDICTION_MODE: model
    volumes:
      - ./model:/app/ml/artifacts/v1:ro
    restart: unless-stopped
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8600/api/model', timeout=3))['model_status'] == 'live'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    image: smart-food-delivery-web:${RELEASE_SHA:?}
    build:
      context: ${SOURCE_DIR:?}/apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: /
        INTERNAL_API_URL: http://api:8600
    environment:
      INTERNAL_API_URL: http://api:8600
    ports:
      - ${WEB_BIND:-127.0.0.1}:${WEB_PORT:-38600}:3600
    restart: unless-stopped
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3600/api/model').then(r => r.json()).then(m => process.exit(m.model_status === 'live' ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
